name: webstats

x-php: &php
  image: webstats-php
  volumes:
    - ./app:/var/www/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *php
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  horizon:
    <<: *php
    command: php artisan horizon
    profiles: ["workers"]

  scheduler:
    <<: *php
    command: php artisan schedule:work
    profiles: ["workers"]

  node:
    image: node:22-alpine
    working_dir: /var/www/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./app:/var/www/app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webstats
      POSTGRES_USER: webstats
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstats -d webstats"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  demo-site:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro

volumes:
  pgdata:
  redisdata:
