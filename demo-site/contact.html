<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Shop — контакты</title>
    <link rel="stylesheet" href="/style.css">
    <script>window.webstats = window.webstats || function () { (window.webstats.q = window.webstats.q || []).push(arguments); };</script>
    <script defer data-site="pk_demo" data-allow-localhost data-debug src="http://localhost:8080/js/webstats.js"></script>
</head>
<body>
<header>
    <nav>
        <a class="logo" href="/">Demo Shop</a>
        <a href="/catalog.html">Каталог</a>
        <a href="/contact.html">Контакты</a>
        <a href="/spa.html">SPA</a>
    </nav>
</header>
<main>
    <div class="card">
        <h1>Оставить заявку</h1>
        <form id="lead-form">
            <label>Имя
                <input name="name" required>
            </label>
            <label>Телефон
                <input name="phone" type="tel" required>
            </label>
            <label>Комментарий
                <textarea name="comment" rows="3"></textarea>
            </label>
            <button type="submit">Отправить</button>
        </form>
        <p id="lead-thanks" hidden>Спасибо! Мы перезвоним в течение дня.</p>
        <p class="hint">Отправка формы вызывает <code>webstats('lead')</code>. Данные формы никуда не отправляются.</p>
    </div>
</main>
<script>
    document.getElementById('lead-form').addEventListener('submit', function (event) {
        event.preventDefault();
        window.webstats('lead', { props: { source: 'contact_form' } });
        event.target.hidden = true;
        document.getElementById('lead-thanks').hidden = false;
    });
</script>
</body>
</html>
