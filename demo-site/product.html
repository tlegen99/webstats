<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Shop — товар</title>
    <link rel="stylesheet" href="/style.css">
    <script>window.webstats = window.webstats || function () { (window.webstats.q = window.webstats.q || []).push(arguments); };</script>
    <script defer data-site="pk_demo" data-allow-localhost data-debug src="http://localhost:8080/js/webstats.js"></script>
</head>
<body>
<header>
    <nav>
        <a class="logo" href="/">Demo Shop</a>
        <a href="/catalog.html">Каталог</a>
        <a href="/contact.html">Контакты</a>
        <a href="/spa.html">SPA</a>
    </nav>
</header>
<main>
    <div class="card">
        <h1>Кроссовки Run</h1>
        <p class="muted">Лёгкие кроссовки для ежедневных пробежек. Размеры 39–46.</p>
        <p><strong>6 990 ₽</strong></p>
        <p>
            <button type="button" data-webstats-event="add_to_cart" data-webstats-props='{"product":"run","price":6990}'>В корзину</button>
            <button class="secondary" type="button" data-webstats-event="add_to_wishlist" data-webstats-props='{"product":"run"}'>В избранное</button>
        </p>
        <p class="hint">Кнопки отправляют события <code>add_to_cart</code> и <code>add_to_wishlist</code> со свойствами товара.</p>
    </div>
    <p><a href="/catalog.html">← Назад в каталог</a></p>
</main>
</body>
</html>
